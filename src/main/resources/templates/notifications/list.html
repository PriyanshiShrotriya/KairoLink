<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="fragments/navbar :: navbar"></div>

    <main class="container notification-page">
        <header class="notification-page-header">
            <div class="notification-heading">
                <span class="notification-eyebrow">YOUR UPDATES</span>
                <div class="notification-title-row">
                    <h1>Notifications</h1>
                    <span th:if="${unreadCount > 0}" class="notification-unread-count" th:text="${unreadCount}"></span>
                </div>
                <p>Stay up to date with your rides and bookings.</p>
            </div>

            <div th:if="${unreadCount > 0}" class="notification-actions">
                <form method="post" th:action="@{/notifications/read-all}" class="notification-bulk-form">
                    <button type="submit" class="btn btn-secondary notification-button notification-button-secondary">Mark all as read</button>
                </form>
            </div>
        </header>

        <div th:if="${notifications.isEmpty()}" class="empty-state notification-empty-state">
            <p>No notifications yet</p>
            <span>When there is news about your rides, it will show up here.</span>
        </div>

        <div th:unless="${notifications.isEmpty()}" class="notification-list">
            <div th:each="notification : ${notifications}" class="notification-item notification-card" th:classappend="${!notification.read} ? 'unread' : ''">
                <div class="notification-header">
                    <h3 th:text="${notification.title}"></h3>
                    <small class="notification-timestamp" th:text="${#dates.format(notification.createdAt, 'MMM dd, yyyy HH:mm')}"></small>
                </div>
                <p th:text="${notification.message}"></p>
                <div class="notification-type" th:text="${notification.type}"></div>

                <th:block th:if="${notification.type.name() == 'BOOKING_REQUESTED' and notification.bookingId != null}">
                    <a th:href="@{/driver/bookings(booking=${notification.bookingId})}" class="btn btn-sm btn-primary notification-button notification-button-primary">View Request</a>
                </th:block>

                <th:block th:if="${!notification.read}">
                    <form method="post" th:action="@{/notifications/{id}/read(id=${notification.id})}" class="notification-read-form">
                        <button type="submit" class="btn btn-sm btn-primary notification-button notification-button-primary">Mark as read</button>
                    </form>
                </th:block>
            </div>
        </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>
</body>
</html>
