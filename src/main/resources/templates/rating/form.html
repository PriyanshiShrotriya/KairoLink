<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Ride</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="rating-page">
    <div th:replace="fragments/navbar :: navbar"></div>

    <main class="rating-shell">
        <header class="rating-header">
            <span class="rating-accent" aria-hidden="true"></span>
            <p class="rating-eyebrow">YOUR JOURNEY</p>
            <h1>Rate your ride</h1>
            <p>Share a quick reflection to help keep KairoLink welcoming.</p>
        </header>

        <div class="rating-card ride-summary">
            <p><strong>Ride ID:</strong> <span th:text="${ride.id}"></span></p>
            <p><strong>Driver:</strong> <span th:text="${ride.driver.name}"></span></p>
            <p><strong>Route:</strong> <span th:text="${ride.source + ' → ' + ride.destination}"></span></p>
        </div>

        <form class="rating-card rating-form" method="post" th:action="@{/rides/{id}/rate(id=${ride.id})}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="form-group">
                <label for="reviewedUserId">Rate:</label>
                <select id="reviewedUserId" name="reviewedUserId" required>
                    <option th:each="reviewedUser : ${reviewedUsers}"
                            th:value="${reviewedUser.id}"
                            th:text="${reviewedUser.name}"></option>
                </select>
            </div>

            <div class="form-group">
                <label for="stars">Rating (1-5 stars):</label>
                <select id="stars" name="stars" required>
                    <option value="">Select rating</option>
                    <option value="1">1 star - Poor</option>
                    <option value="2">2 stars - Fair</option>
                    <option value="3">3 stars - Good</option>
                    <option value="4">4 stars - Very Good</option>
                    <option value="5">5 stars - Excellent</option>
                </select>
            </div>

            <div class="form-group">
                <label for="comment">Comment (optional):</label>
                <textarea id="comment" name="comment" rows="4" placeholder="Share your experience..."></textarea>
            </div>

            <div class="form-actions rating-form-actions">
                <button type="submit" class="ride-button ride-button--primary">Submit rating</button>
                <a href="/rides" class="ride-button ride-button--secondary">Cancel</a>
            </div>
        </form>
    </main>

    <div th:replace="fragments/footer :: footer"></div>
</body>
</html>
