<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Ride</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container">
        <h1>Rate Your Ride</h1>

        <div class="ride-summary">
            <p><strong>Ride ID:</strong> <span th:text="${ride.id}"></span></p>
            <p><strong>Driver:</strong> <span th:text="${ride.driver.name}"></span></p>
            <p><strong>Route:</strong> <span th:text="${ride.source + ' → ' + ride.destination}"></span></p>
        </div>

        <form method="post" th:action="@{/rides/{id}/rate(id=${ride.id})}">
            <input type="hidden" name="reviewedUserId" th:value="${ride.driver.id}">

            <div class="form-group">
                <label for="stars">Rating (1-5 stars):</label>
                <select id="stars" name="stars" required>
                    <option value="">Select rating</option>
                    <option value="1">1 star - Poor</option>
                    <option value="2">2 stars - Fair</option>
                    <option value="3">3 stars - Good</option>
                    <option value="4">4 stars - Very Good</option>
                    <option value="5">5 stars - Excellent</option>
                </select>
            </div>

            <div class="form-group">
                <label for="comment">Comment (optional):</label>
                <textarea id="comment" name="comment" rows="4" placeholder="Share your experience..."></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Submit Rating</button>
                <a href="/rides" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>

    <div th:replace="fragments/footer :: footer"></div>
</body>
</html>
