<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container">
    <section class="hero">
        <h1>My Rides</h1>
        <p>Your published journeys.</p>
        <p><a th:href="@{/rides/new}">Publish a Ride</a></p>
    </section>
    <p th:if="${param.created}" role="status">Your ride was published successfully.</p>
    <p th:if="${param.updated}" role="status">Your ride was updated successfully.</p>
    <p th:if="${param.cancelled}" role="status">Your ride was cancelled.</p>
    <section th:if="${#lists.isEmpty(rides)}"><p>You have not published any rides yet.</p></section>
    <section th:unless="${#lists.isEmpty(rides)}">
        <article th:each="ride : ${rides}">
            <h2><span th:text="${ride.source}"></span> to <span th:text="${ride.destination}"></span></h2>
            <p>Departure: <span th:text="${ride.departureTime}"></span></p>
            <p>Seats: <span th:text="${ride.seats}"></span> · Price: <span th:text="${ride.price}"></span></p>
            <p>Status: <span th:text="${ride.status}"></span></p>
            <p th:if="${ride.status.name() == 'ACTIVE' and ride.departureTime.isAfter(T(java.time.LocalDateTime).now())}">
                <a th:href="@{/rides/{id}/edit(id=${ride.id})}">Edit</a>
                <form th:action="@{/rides/{id}/cancel(id=${ride.id})}" method="post" style="display:inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit">Cancel</button>
                </form>
            </p>
        </article>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
