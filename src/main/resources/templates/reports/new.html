<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
    <section class="hero">
        <h1>Report an Issue</h1>
        <p>Let us know about any problems you've encountered.</p>
    </section>

    <div th:if="${errorMessage}" class="alert alert-error">
        <p th:text="${errorMessage}"></p>
    </div>

    <section class="form-section">
        <form th:action="@{/reports}" method="post">
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" required>
                    <option value="">Select a category</option>
                    <option value="Safety Concern">Safety Concern</option>
                    <option value="Driver Behavior">Driver Behavior</option>
                    <option value="Rider Behavior">Rider Behavior</option>
                    <option value="Payment Issue">Payment Issue</option>
                    <option value="App Bug">App Bug</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea
                    id="description"
                    name="description"
                    rows="6"
                    maxlength="2000"
                    required
                    placeholder="Please describe the issue in detail..."></textarea>
                <small class="form-hint">Maximum 2000 characters</small>
            </div>

            <div class="form-group">
                <label for="rideId">Related Ride ID (optional)</label>
                <input
                    type="number"
                    id="rideId"
                    name="rideId"
                    placeholder="Enter ride ID if applicable">
            </div>

            <div class="form-group">
                <label for="bookingId">Related Booking ID (optional)</label>
                <input
                    type="number"
                    id="bookingId"
                    name="bookingId"
                    placeholder="Enter booking ID if applicable">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Submit Report</button>
                <a th:href="@{/reports/my-issues}" class="btn btn-secondary">View My Reports</a>
            </div>
        </form>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<style>
    .form-section {
        max-width: 600px;
        margin: 32px auto;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #333;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
        font-family: inherit;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: #007bff;
        box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
    }

    .form-hint {
        display: block;
        margin-top: 4px;
        font-size: 12px;
        color: #666;
    }

    .form-actions {
        margin-top: 24px;
        display: flex;
        gap: 12px;
    }

    .btn {
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        transition: all 0.2s ease;
    }

    .btn-primary {
        background-color: #007bff;
        color: white;
    }

    .btn-primary:hover {
        background-color: #0056b3;
    }

    .btn-secondary {
        background-color: #6c757d;
        color: white;
    }

    .btn-secondary:hover {
        background-color: #5a6268;
    }

    .alert {
        padding: 12px 16px;
        margin: 16px 0;
        border-radius: 4px;
    }

    .alert-error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
    }
</style>
</body>
</html>
