<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
    <section class="hero">
        <h1>Booking Monitoring</h1>
        <p>View all bookings on the platform.</p>
    </section>

    <section class="monitoring-table-section">
        <div th:if="${bookings.isEmpty()}" class="empty-state">
            <p>No bookings found.</p>
        </div>

        <table class="monitoring-table" th:unless="${bookings.isEmpty()}">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Rider</th>
                    <th>Driver</th>
                    <th>Route</th>
                    <th>Seats Booked</th>
                    <th>Total Price</th>
                    <th>Status</th>
                    <th>Created</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="booking : ${bookings}">
                    <td th:text="${booking.id}"></td>
                    <td th:text="${booking.rider.name}"></td>
                    <td th:text="${booking.ride.driver.name}"></td>
                    <td th:text="${booking.ride.source} + ' → ' + ${booking.ride.destination}"></td>
                    <td th:text="${booking.seatsRequested}"></td>
                    <td th:text="'$' + ${#numbers.formatDecimal(booking.totalPrice, 1, 2)}"></td>
                    <td>
                        <span class="status-badge" th:classappend="${'status-' + booking.status.name().toLowerCase()}" th:text="${booking.status.name()}"></span>
                    </td>
                    <td th:text="${#temporals.format(booking.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                </tr>
            </tbody>
        </table>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<style>
    .empty-state {
        padding: 32px 16px;
        text-align: center;
        color: #666;
        background-color: #f9f9f9;
        border-radius: 4px;
        margin: 16px 0;
    }

    .monitoring-table-section {
        margin: 32px 0;
        overflow-x: auto;
    }

    .monitoring-table {
        width: 100%;
        border-collapse: collapse;
        border: 1px solid #e0e0e0;
        background-color: #fff;
    }

    .monitoring-table thead {
        background-color: #f5f5f5;
    }

    .monitoring-table th,
    .monitoring-table td {
        padding: 12px 16px;
        text-align: left;
        border-bottom: 1px solid #e0e0e0;
    }

    .monitoring-table th {
        font-weight: 600;
        color: #333;
    }

    .monitoring-table tbody tr:hover {
        background-color: #f9f9f9;
    }

    .status-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
    }

    .status-pending {
        background-color: #fff3cd;
        color: #856404;
    }

    .status-confirmed {
        background-color: #d4edda;
        color: #155724;
    }

    .status-rejected {
        background-color: #f8d7da;
        color: #721c24;
    }

    .status-cancelled {
        background-color: #e2e3e5;
        color: #383d41;
    }
</style>
</body>
</html>
