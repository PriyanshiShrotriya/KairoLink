<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
    <section class="hero">
        <h1>Issue Reports</h1>
        <p>Review and manage reported issues from users.</p>
    </section>

    <div th:if="${successMessage}" class="alert alert-success">
        <p th:text="${successMessage}"></p>
    </div>

    <div th:if="${errorMessage}" class="alert alert-error">
        <p th:text="${errorMessage}"></p>
    </div>

    <div th:if="${issues.isEmpty()}" class="empty-state">
        <p>No issues have been reported yet.</p>
    </div>

    <section class="monitoring-table-section" th:unless="${issues.isEmpty()}">
        <table class="monitoring-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Reporter</th>
                    <th>Category</th>
                    <th>Description</th>
                    <th>Ride</th>
                    <th>Booking</th>
                    <th>Status</th>
                    <th>Created</th>
                    <th>Resolved</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="issue : ${issues}">
                    <td th:text="${issue.id}"></td>
                    <td>
                        <div th:text="${issue.reporter.name}"></div>
                        <small style="color: #666;" th:text="${issue.reporter.email}"></small>
                    </td>
                    <td th:text="${issue.category}"></td>
                    <td style="max-width: 250px; word-wrap: break-word;" th:text="${issue.description}"></td>
                    <td th:text="${issue.ride != null ? issue.ride.id : '-'}"></td>
                    <td th:text="${issue.booking != null ? issue.booking.id : '-'}"></td>
                    <td>
                        <span class="status-badge" th:classappend="${'status-' + issue.status.name().toLowerCase()}" th:text="${issue.status.name()}"></span>
                    </td>
                    <td th:text="${#temporals.format(issue.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                    <td th:text="${issue.resolvedAt != null ? #temporals.format(issue.resolvedAt, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                    <td class="actions-cell">
                        <th:block th:if="${issue.status.name() == 'OPEN'}">
                            <form th:action="@{/admin/issues/{id}/status(id=${issue.id})}" method="post" class="inline-form">
                                <input type="hidden" name="status" value="IN_PROGRESS">
                                <button type="submit" class="btn btn-small btn-progress">In Progress</button>
                            </form>
                            <form th:action="@{/admin/issues/{id}/status(id=${issue.id})}" method="post" class="inline-form">
                                <input type="hidden" name="status" value="RESOLVED">
                                <button type="submit" class="btn btn-small btn-resolve">Resolve</button>
                            </form>
                        </th:block>
                        <th:block th:if="${issue.status.name() == 'IN_PROGRESS'}">
                            <form th:action="@{/admin/issues/{id}/status(id=${issue.id})}" method="post" class="inline-form">
                                <input type="hidden" name="status" value="RESOLVED">
                                <button type="submit" class="btn btn-small btn-resolve">Resolve</button>
                            </form>
                            <form th:action="@{/admin/issues/{id}/status(id=${issue.id})}" method="post" class="inline-form">
                                <input type="hidden" name="status" value="OPEN">
                                <button type="submit" class="btn btn-small btn-reopen">Reopen</button>
                            </form>
                        </th:block>
                        <th:block th:if="${issue.status.name() == 'RESOLVED'}">
                            <form th:action="@{/admin/issues/{id}/status(id=${issue.id})}" method="post" class="inline-form">
                                <input type="hidden" name="status" value="OPEN">
                                <button type="submit" class="btn btn-small btn-reopen">Reopen</button>
                            </form>
                        </th:block>
                    </td>
                </tr>
            </tbody>
        </table>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<style>
    .empty-state {
        padding: 48px 16px;
        text-align: center;
        background-color: #f9f9f9;
        border-radius: 4px;
        margin: 24px 0;
        color: #666;
    }

    .monitoring-table-section {
        margin: 32px 0;
        overflow-x: auto;
    }

    .monitoring-table {
        width: 100%;
        border-collapse: collapse;
        border: 1px solid #e0e0e0;
        background-color: #fff;
    }

    .monitoring-table thead {
        background-color: #f5f5f5;
    }

    .monitoring-table th,
    .monitoring-table td {
        padding: 12px 16px;
        text-align: left;
        border-bottom: 1px solid #e0e0e0;
    }

    .monitoring-table th {
        font-weight: 600;
        color: #333;
    }

    .monitoring-table tbody tr:hover {
        background-color: #f9f9f9;
    }

    .status-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
    }

    .status-open {
        background-color: #fff3cd;
        color: #856404;
    }

    .status-in_progress {
        background-color: #cce5ff;
        color: #004085;
    }

    .status-resolved {
        background-color: #d4edda;
        color: #155724;
    }

    .actions-cell {
        white-space: nowrap;
    }

    .inline-form {
        display: inline;
        margin-right: 4px;
    }

    .btn-small {
        padding: 4px 10px;
        font-size: 12px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
    }

    .btn-progress {
        background-color: #cce5ff;
        color: #004085;
    }

    .btn-resolve {
        background-color: #d4edda;
        color: #155724;
    }

    .btn-reopen {
        background-color: #fff3cd;
        color: #856404;
    }

    .alert {
        padding: 12px 16px;
        margin: 16px 0;
        border-radius: 4px;
    }

    .alert-success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
    }

    .alert-error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
    }
</style>
</body>
</html>
