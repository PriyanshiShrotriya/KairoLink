<!DOCTYPE html>
<html lang="en"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
    <section class="hero">
        <h1>User Management</h1>
        <p>View and manage platform users.</p>
    </section>

    <div th:if="${successMessage}" class="alert alert-success">
        <p th:text="${successMessage}"></p>
    </div>

    <div th:if="${errorMessage}" class="alert alert-error">
        <p th:text="${errorMessage}"></p>
    </div>

    <section class="users-table-section">
        <table class="users-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.name}"></td>
                    <td th:text="${user.email}"></td>
                    <td>
                        <span th:each="role : ${user.roles}" th:text="${role}"></span>
                    </td>
                    <td>
                        <span class="status-badge" th:classappend="${'status-' + user.status.name().toLowerCase()}" th:text="${user.status.name()}"></span>
                    </td>
                    <td class="actions-cell">
                        <th:block th:if="${user.status.name() == 'ACTIVE'}">
                            <form th:action="@{/admin/users/{id}/suspend(id=${user.id})}" method="post" class="inline-form">
                                <button type="submit" class="btn btn-warn">Suspend</button>
                            </form>
                            <form th:action="@{/admin/users/{id}/ban(id=${user.id})}" method="post" class="inline-form">
                                <button type="submit" class="btn btn-danger">Ban</button>
                            </form>
                        </th:block>
                        <th:block th:if="${user.status.name() == 'SUSPENDED'}">
                            <form th:action="@{/admin/users/{id}/reactivate(id=${user.id})}" method="post" class="inline-form">
                                <button type="submit" class="btn btn-success">Activate</button>
                            </form>
                            <form th:action="@{/admin/users/{id}/ban(id=${user.id})}" method="post" class="inline-form">
                                <button type="submit" class="btn btn-danger">Ban</button>
                            </form>
                        </th:block>
                        <th:block th:if="${user.status.name() == 'BANNED'}">
                            <form th:action="@{/admin/users/{id}/reactivate(id=${user.id})}" method="post" class="inline-form">
                                <button type="submit" class="btn btn-success">Activate</button>
                            </form>
                        </th:block>
                    </td>
                </tr>
            </tbody>
        </table>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<style>
    .alert {
        padding: 12px 16px;
        margin: 16px 0;
        border-radius: 4px;
    }

    .alert-success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
    }

    .alert-error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
    }

    .users-table-section {
        margin: 32px 0;
        overflow-x: auto;
    }

    .users-table {
        width: 100%;
        border-collapse: collapse;
        border: 1px solid #e0e0e0;
        background-color: #fff;
    }

    .users-table thead {
        background-color: #f5f5f5;
    }

    .users-table th,
    .users-table td {
        padding: 12px 16px;
        text-align: left;
        border-bottom: 1px solid #e0e0e0;
    }

    .users-table th {
        font-weight: 600;
        color: #333;
    }

    .users-table tbody tr:hover {
        background-color: #f9f9f9;
    }

    .status-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
    }

    .status-active {
        background-color: #d4edda;
        color: #155724;
    }

    .status-suspended {
        background-color: #fff3cd;
        color: #856404;
    }

    .status-banned {
        background-color: #f8d7da;
        color: #721c24;
    }

    .actions-cell {
        white-space: nowrap;
    }

    .inline-form {
        display: inline;
        margin-right: 8px;
    }

    .btn {
        padding: 6px 12px;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        font-weight: 600;
        transition: all 0.2s ease;
    }

    .btn-success {
        background-color: #28a745;
        color: white;
    }

    .btn-success:hover {
        background-color: #218838;
    }

    .btn-warn {
        background-color: #ffc107;
        color: #333;
    }

    .btn-warn:hover {
        background-color: #e0a800;
    }

    .btn-danger {
        background-color: #dc3545;
        color: white;
    }

    .btn-danger:hover {
        background-color: #c82333;
    }
</style>
</body>
</html>
