spring.application.name=KairoLink
server.port=8080
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.placeholders.booking_column_storage=STORED

spring.thymeleaf.cache=false

spring.devtools.restart.enabled=true

kairolink.osrm.base-url=${OSRM_BASE_URL:https://router.project-osrm.org}
kairolink.matching.route-proximity-meters=${ROUTE_PROXIMITY_METERS:2000}
kairolink.matching.driver-flexibility-minutes=${DRIVER_FLEXIBILITY_MINUTES:30}
kairolink.matching.rider-default-tolerance-minutes=${RIDER_DEFAULT_TOLERANCE_MINUTES:30}
kairolink.matching.minimum-lead-time-minutes=${MINIMUM_LEAD_TIME_MINUTES:10}
kairolink.matching.default-search-window-minutes=${DEFAULT_SEARCH_WINDOW_MINUTES:30}
kairolink.matching.maximum-rider-tolerance-minutes=${MAXIMUM_RIDER_TOLERANCE_MINUTES:180}
kairolink.nominatim.base-url=${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
kairolink.nominatim.user-agent=${NOMINATIM_USER_AGENT:KairoLink/0.0.1}